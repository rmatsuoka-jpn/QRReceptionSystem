<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR受付システム｜QR発行</title>
<script src="./vendor/qrcode.min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;color:#182234;background:#f6f8fb}
*{box-sizing:border-box}body{margin:0}header{background:#183956;color:#fff;padding:18px max(20px,calc((100% - 760px)/2))}
header h1{font-size:1.45rem;margin:0 0 10px}nav a{color:white;margin-right:18px}
nav a[aria-current]{font-weight:bold;text-decoration-thickness:3px}main{max-width:760px;margin:24px auto;padding:0 16px}
.panel{background:#fff;border:1px solid #d7dee8;border-radius:12px;padding:22px}
label{display:block;font-weight:bold;margin:16px 0 6px}input{padding:10px;width:100%;max-width:410px;font:inherit}
button{padding:10px 16px;border:1px solid #b7c4d2;border-radius:7px;background:white;cursor:pointer;font:inherit}
button.primary{background:#155e75;border-color:#155e75;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
#card{width:272px;margin:22px 0;padding:18px;border:1px solid #cdd5e0;text-align:center;background:#fff;break-inside:avoid}
#qr{display:flex;justify-content:center;min-height:192px;align-items:center}#qr img,#qr canvas{max-width:100%}
#qrLabel{overflow-wrap:anywhere;font-weight:bold;margin:12px 0 0}.hint{color:#536277}
@media print{header,.form-area,.actions,.hint{display:none!important}body,main,.panel{background:white!important;margin:0;padding:0;border:0!important}#card{margin:0;border:1px solid #bbb}}
</style>
</head>
<body>
<header><h1>QR受付システム <small style="color:#dce9f5">検証版</small></h1>
<nav><a href="./index.html">受付・読み取り</a><a href="./issue.html" aria-current="page">QRコード発行</a></nav></header>
<main><section class="panel">
<div class="form-area"><h2>QRコード発行（単票・検証用）</h2>
<p class="hint">受付番号や職員番号を入力してQRを生成します。名簿からの一括発行や配布用帳票は今後の仕様検討対象です。</p>
<label for="code">受付番号・職員番号</label>
<input id="code" type="text" maxlength="100" autocomplete="off" placeholder="例：A001">
<div class="actions"><button id="generate" class="primary" type="button">QRコードを生成</button>
<button id="download" type="button" disabled>PNG保存</button>
<button id="print" type="button" disabled>印刷</button></div></div>
<p id="message" role="status" aria-live="polite"></p>
<div id="card" hidden><strong>受付用QRコード</strong><div id="qr"></div><p id="qrLabel"></p></div>
</section></main>
<script>
(function(){
"use strict";
const code=document.getElementById("code");
const qr=document.getElementById("qr");
const card=document.getElementById("card");
const label=document.getElementById("qrLabel");
const message=document.getElementById("message");
const download=document.getElementById("download");
const print=document.getElementById("print");
document.getElementById("generate").addEventListener("click",()=>{
 const value=code.value.trim();
 if(!value){message.textContent="受付番号を入力してください。";return;}
 if(typeof QRCode==="undefined"){message.textContent="QR発行ライブラリが見つかりません。vendor/qrcode.min.js を確認してください。";return;}
 try{
   qr.replaceChildren();
   new QRCode(qr,{text:value,width:192,height:192,correctLevel:QRCode.CorrectLevel.M});
   label.textContent=value;card.hidden=false;download.disabled=false;print.disabled=false;
   message.textContent="QRコードを生成しました。";
 }catch(error){message.textContent="生成できませんでした。入力文字数を減らして再試行してください。";card.hidden=true;download.disabled=true;print.disabled=true;}
});
download.addEventListener("click",()=>{
 const image=qr.querySelector("img");
 const canvas=qr.querySelector("canvas");
 const src=image&&image.src&&image.src.startsWith("data:")?image.src:canvas?canvas.toDataURL("image/png"):"";
 if(!src){message.textContent="PNGを作成できませんでした。印刷を利用してください。";return;}
 const link=document.createElement("a");link.href=src;link.download="qr_"+code.value.trim().replace(/[^a-zA-Z0-9_-]/g,"_").slice(0,40)+".png";
 document.body.appendChild(link);link.click();link.remove();
});
print.addEventListener("click",()=>window.print());
})();
</script>
</body></html>
