<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR受付システム｜受付</title>
<script src="./vendor/html5-qrcode.min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;color:#182234;background:#f6f8fb}
*{box-sizing:border-box}body{margin:0}header{background:#183956;color:#fff;padding:18px max(20px,calc((100% - 960px)/2))}
header h1{font-size:1.45rem;margin:0 0 10px}nav a{color:#fff;margin-right:18px}nav a[aria-current]{font-weight:bold;text-decoration-thickness:3px}
main{max-width:960px;margin:24px auto;padding:0 16px 48px}
.panel{background:#fff;border:1px solid #d7dee8;border-radius:12px;padding:18px;margin-bottom:18px}
#reader{max-width:490px;margin:12px auto}h2{font-size:1.15rem;margin-top:0}
button{padding:9px 15px;border:1px solid #b7c4d2;background:white;border-radius:7px;cursor:pointer;font:inherit}
button.primary{background:#155e75;border-color:#155e75;color:#fff}button.danger{color:#9b1c1c}
button:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}#status{padding:12px;border-radius:8px;background:#eef6f7;min-height:45px}
.warning{border-left:4px solid #b45309;background:#fff7ed;padding:12px;margin:10px 0}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #d7dee8;text-align:left;padding:9px 6px;word-break:break-word}
th{background:#eef2f6}small,.hint{color:#536277} .scroll{overflow-x:auto}
@media(max-width:600px){header{padding:16px}main{margin-top:16px}.panel{padding:14px}}
</style>
</head>
<body>
<header><h1>QR受付システム <small style="color:#dce9f5">検証版</small></h1>
<nav><a href="./index.html" aria-current="page">受付・読み取り</a><a href="./issue.html">QRコード発行</a></nav></header>
<main>
<section class="panel">
<h2>QRコード読み取り</h2>
<p id="environment" class="warning" hidden></p>
<p id="status" role="status" aria-live="polite">カメラまたは画像ファイルを選択して、読み取りを開始してください。</p>
<div id="reader"></div>
</section>
<section class="panel">
<h2>受付記録 <span id="count">0</span> 件</h2>
<div class="toolbar"><button class="primary" id="csvBtn" type="button">CSVダウンロード</button>
<button class="danger" id="clearBtn" type="button">受付記録をクリア</button></div>
<p class="hint">この検証版の記録は受付PCのブラウザ内に保存されます。Webサーバーには保存されません。
端末変更・ブラウザデータ削除に備え、受付終了時はCSVを必ず保存してください。</p>
<div class="scroll"><table><thead><tr><th>No.</th><th>受付番号（QR内容）</th><th>受付日時</th></tr></thead>
<tbody id="rows"></tbody></table></div>
</section>
</main>
<script>
(function(){
"use strict";
const key="QRReceptionSystem.records.v1";
const status=document.getElementById("status");
const rows=document.getElementById("rows");
const count=document.getElementById("count");
const environment=document.getElementById("environment");
let records=[];
let lastCode="",lastTime=0;
try{
  const saved=JSON.parse(localStorage.getItem(key)||"[]");
  if(Array.isArray(saved)) records=saved.filter(r=>r&&typeof r.code==="string"&&typeof r.time==="string");
}catch(error){environment.hidden=false;environment.textContent="保存済み受付データを読み込めません。CSVでバックアップしてください。";}
function addRow(r,i){
 const tr=document.createElement("tr");
 [String(i+1),r.code,r.time].forEach(value=>{
   const td=document.createElement("td");td.textContent=value;tr.appendChild(td);
 });
 rows.appendChild(tr);
}
function render(){
 rows.replaceChildren();
 records.forEach(addRow);
 count.textContent=String(records.length);
}
function save(){
 try{localStorage.setItem(key,JSON.stringify(records));return true;}
 catch(error){environment.hidden=false;environment.textContent="ブラウザへの保存に失敗しました。表示中の記録をCSVに出力してください。";return false;}
}
function handleCode(text){
 const value=String(text).trim();
 if(!value){status.textContent="空のQRコードは登録できません。";return;}
 if(value.length>256){status.textContent="QRコードの内容が長すぎます。";return;}
 const now=Date.now();
 if(value===lastCode&&now-lastTime<2000)return;
 lastCode=value;lastTime=now;
 if(records.some(r=>r.code===value)){status.textContent="⚠ 受付済み: "+value;return;}
 const item={code:value,time:new Date().toLocaleString("ja-JP")};
 records.push(item);save();render();
 status.textContent="✓ 受付しました: "+value;
}
function csvCell(value){
 const safe=String(value).replace(/^[=+@\-\t\r\n]/,"'$&");
 return '"'+safe.replace(/"/g,'""')+'"';
}
document.getElementById("csvBtn").addEventListener("click",()=>{
 if(!records.length){alert("受付記録がありません。");return;}
 const data=[["No.","受付番号","受付日時"],...records.map((r,i)=>[i+1,r.code,r.time])];
 const csv="\uFEFF"+data.map(row=>row.map(csvCell).join(",")).join("\r\n")+"\r\n";
 const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
 const a=document.createElement("a");a.href=url;
 a.download="uketuke_"+new Date().toLocaleDateString("sv-SE")+".csv";
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
});
document.getElementById("clearBtn").addEventListener("click",()=>{
 if(!confirm("このPCの受付記録をすべて削除します。CSV出力は済んでいますか？"))return;
 records=[];save();render();status.textContent="受付記録をクリアしました。";
});
render();
if(!window.isSecureContext){
 environment.hidden=false;
 environment.textContent="現在のURLは保護された接続ではありません。庁内サーバーをHTTPで開いている場合、ブラウザのカメラは通常使用できません。HTTPSで配信してください。画像ファイルからの読み取りは利用できる場合があります。";
}
if(typeof Html5QrcodeScanner==="undefined"){
 status.textContent="QR読み取りライブラリが見つかりません。vendor/html5-qrcode.min.js が配置されているか確認してください。";
 return;
}
try{
 const scanner=new Html5QrcodeScanner("reader",{fps:10,qrbox:{width:250,height:250},rememberLastUsedCamera:true},false);
 scanner.render(text=>handleCode(text),()=>{});
}catch(error){status.textContent="読み取り機能の初期化に失敗しました: "+error.message;}
})();
</script>
</body></html>
